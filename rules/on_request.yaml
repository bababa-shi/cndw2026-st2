---
name: on_request
pack: scaling_pve
description: Scale the Proxmox web tier when a POST request hits the webhook endpoint.
enabled: true

trigger:
  type: core.st2.webhook
  parameters:
    url: /scale

action:
  ref: scaling_pve.on_request
  parameters:
    direction: "{{ trigger.body.direction | default('auto') }}"
    terraform_host: "{{ trigger.body.terraform_host | default('localhost') }}"
    lb_host: "{{ trigger.body.lb_host | default('localhost') }}"
    total_machines: "{{ trigger.body.total_machines | default(none) | use_none }}"
